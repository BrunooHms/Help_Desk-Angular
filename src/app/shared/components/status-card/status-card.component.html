<div class="stat-card">
    <div class="info">
        <span class="title"> {{title}} </span>
        <span class="value"> {{ value }} </span>
    </div>
    <div class="icon" [style.background-color]="bgColor">
        <mat-icon class="material-icons-outlined" > {{ icon }} </mat-icon>
    </div>
</div>
