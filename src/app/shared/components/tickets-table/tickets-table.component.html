<div class="table-container">
  
      <div class="title">Ingressos Recentes</div>
  
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z1">
  
        <!-- ID -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>Número</th>
          <td mat-cell *matCellDef="let ticket"> # {{ ticket.id }}</td>
        </ng-container>
    
        <!-- Título -->
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>Título</th>
          <td mat-cell *matCellDef="let ticket">{{ ticket.title }}</td>
        </ng-container>
  
        <!-- Prioridade -->
        <ng-container matColumnDef="priority">
          <th mat-header-cell *matHeaderCellDef>Prioridade</th>
          <td mat-cell *matCellDef="let ticket" >
            <p class="color-status-warning"> {{ ticket.priority }} </p>
          </td>
        </ng-container>
    
        <!-- Status -->
        <ng-container matColumnDef="status" >
          <th mat-header-cell *matHeaderCellDef >Status</th>
          <td mat-cell *matCellDef="let ticket" >
              <p class="color-status-open" > {{ ticket.status }} </p>
          </td>
        </ng-container>
  
        <!-- Responsavel -->
        <ng-container matColumnDef="responsible" >
          <th mat-header-cell *matHeaderCellDef>Responsável</th>
          <td mat-cell *matCellDef="let ticket">
              {{ ticket.responsible }}
          </td>
        </ng-container>
  
        <!-- Data de Abertura -->
        <ng-container matColumnDef="openOfDate">
          <th mat-header-cell *matHeaderCellDef>Data de Abertura</th>
          <td mat-cell *matCellDef="let ticket">
              {{ ticket.openOfDate }}
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    
      </table>
    
    </div>
